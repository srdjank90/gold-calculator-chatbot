<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1c40f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#goldGradient)" stroke="#e67e22" stroke-width="2"/>
  
  <!-- Face -->
  <circle cx="50" cy="45" r="25" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="1"/>
  
  <!-- Eyes -->
  <circle cx="42" cy="38" r="3" fill="#2d3436"/>
  <circle cx="58" cy="38" r="3" fill="#2d3436"/>
  
  <!-- Smile -->
  <path d="M 40 52 Q 50 62 60 52" stroke="#e17055" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Hair -->
  <path d="M 30 30 Q 35 20 50 25 Q 65 20 70 30" fill="#fdcb6e" stroke="#e17055" stroke-width="1"/>
  
  <!-- Crown/Tiara -->
  <path d="M 35 28 L 40 18 L 45 25 L 50 15 L 55 25 L 60 18 L 65 28" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
  
  <!-- Gems on crown -->
  <circle cx="40" cy="20" r="1.5" fill="#e74c3c"/>
  <circle cx="50" cy="17" r="1.5" fill="#9b59b6"/>
  <circle cx="60" cy="20" r="1.5" fill="#3498db"/>
  
  <!-- Text -->
  <text x="50" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#2c3e50">ZLATIJA</text>
</svg>