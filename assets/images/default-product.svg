<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="productGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1c40f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="#f8f9fa" rx="10"/>
  
  <!-- Gold bar shape -->
  <rect x="20" y="35" width="60" height="30" fill="url(#productGradient)" rx="5" stroke="#e67e22" stroke-width="1"/>
  
  <!-- Shine effect -->
  <rect x="25" y="40" width="50" height="4" fill="#fff" opacity="0.3" rx="2"/>
  
  <!-- Text -->
  <text x="50" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#2c3e50">GOLD</text>
</svg>